[project]
name = "ret-c2-337"
version = "1.0.0"
description = "Retail Demand Anomaly Detection Agent (TimesFM 2.5 Zero-Shot) — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]
# Real TimesFM 2.5 local backend (inference_mode="local"). NOT installed in CI —
# run-tests installs only [dev], so the default deterministic `baseline` backend
# keeps CI green. Verified to run on CPU (forecast + forecast_with_covariates);
# the xreg covariate path needs jax (CPU is sufficient) + scikit-learn. GPU is
# optional, not required. Install with: pip install ".[local]"
local = [
    "timesfm[torch]==2.0.1",
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "scikit-learn==1.9.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "real_model: runs the real TimesFM 2.5 model (opt-in; needs the 'local' extra; skipped in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
